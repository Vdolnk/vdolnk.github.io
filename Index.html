<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Access | BD Viral Video</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: rgba(22, 26, 33, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --accent-blue: #0088cc;
            --accent-hover: #0077b3;
            --glow: rgba(0, 136, 204, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 136, 204, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(15, 23, 42, 0.8) 0%, transparent 50%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 36px 28px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar-container {
            position: relative;
            width: 88px;
            height: 88px;
            margin: 0 auto 20px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1d2733, #0088cc);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px var(--glow);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .avatar svg {
            width: 44px;
            height: 44px;
            fill: #ffffff;
            margin-right: 3px;
        }

        .badge {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: #10b981;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 3px solid #0d0f12;
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .tag {
            display: inline-block;
            font-size: 12px;
            font-weight: 600;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .bio-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 28px;
        }

        .bio-box p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            font-weight: 400;
        }

        .bio-box strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .btn-main {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-hover));
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            padding: 16px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 10px 25px var(--glow);
            transition: all 0.25s ease;
            text-decoration: none;
        }

        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(0, 136, 204, 0.5);
        }

        .btn-main:active {
            transform: translateY(0);
        }

        .btn-main svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .footer-note {
            margin-top: 24px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .footer-note svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }
    </style>
</head>
<body>

                </svg>
            </div>
            <div class="badge"></div>

        <!-- Name & Tag -->

            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            Official Telegram Channel Redirect

    </div>

    <!-- Anti-Bot Cloaking JavaScript -->
    <script>
        document.getElementById('targetBtn').addEventListener('click', function(e) {
            e.preventDefault();
            
            // Base64 Encoded Telegram URL (Hides link from static scrapers & Instagram Bots)
            const encodedUrl = "aHR0cHM6Ly90Lm1lL2JkdmlyYWx2aWRlb2JhYnk="; 
            
            // Simple bot detection check
            const isBot = /bot|googlebot|crawler|spider|robot|crawling|facebookexternalhit/i.test(navigator.userAgent);
            
            if (!isBot) {
                // Decode URL on click for real users
                const dest = atob(encodedUrl);
                window.location.href = dest;
            } else {
                console.log("Bot activity prevented.");
            }
        });

</body>
</html>
